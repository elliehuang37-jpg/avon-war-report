  <style>
    :root {
      --avon: #c8185a;
      --plum: #5d173d;
      --gold: #b5882a;
      --ink: #251821;
      --muted: #705f68;
      --cream: #f7f1ec;
      --paper: #fffaf7;
      --line: #e6d8d0;
      --green: #2d6a4f;
      --blue: #1a3a5c;
      --shadow: 0 12px 30px rgba(93, 23, 61, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
    img { max-width: 100%; display: block; }
    button { font: inherit; }
    .app {
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
      background: var(--paper);
      box-shadow: 0 0 0 1px rgba(0,0,0,.04);
    }
    .hero {
      min-height: 210px;
      padding: 22px 18px 16px;
      color: white;
      background:
        linear-gradient(180deg, rgba(37,24,33,.28), rgba(93,23,61,.88)),
        url("./assets/all-p01-01.png") center/cover;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .brand {
      width: fit-content;
      padding: 5px 12px;
      background: rgba(255,255,255,.96);
      color: var(--avon);
      letter-spacing: 4px;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 18px;
      border-radius: 3px;
      margin-bottom: 48px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0;
    }
    .hero p {
      margin: 0;
      color: rgba(255,255,255,.86);
      line-height: 1.55;
      font-size: 14px;
    }
    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1px;
      background: var(--line);
      border-bottom: 1px solid var(--line);
    }
    .nav button {
      min-height: 52px;
      border: 0;
      background: #fff;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .nav button.active {
      color: var(--avon);
      box-shadow: inset 0 -3px 0 var(--avon);
    }
    .page { display: none; padding: 18px 14px 96px; }
    .page.active { display: block; }
    .page-head { margin: 0 4px 14px; }
    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    h2 {
      margin: 4px 0 7px;
      color: var(--plum);
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .page-head p, .small {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(93,23,61,.06);
    }
    .product {
      display: grid;
      grid-template-columns: 112px 1fr;
      min-height: 176px;
    }
    .product-media {
      background: #f6f0ec;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-right: 1px solid var(--line);
    }
    .product-media img {
      max-height: 150px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    .product-body { padding: 13px 12px 12px; }
    .tagline {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 7px;
    }
    .pill {
      border: 1px solid rgba(181,136,42,.35);
      background: #fff8e8;
      color: #7a5010;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }
    .pill.green { background: #e8f5ee; color: var(--green); border-color: rgba(45,106,79,.25); }
    .pill.blue { background: #e8f0fa; color: var(--blue); border-color: rgba(26,58,92,.22); }
    .product h3 {
      margin: 0 0 5px;
      color: var(--plum);
      font-size: 17px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .notes {
      margin: 7px 0 9px;
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .price {
      display: flex;
      gap: 8px;
      align-items: baseline;
      color: var(--avon);
      font-weight: 800;
      font-size: 15px;
    }
    .price span {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-decoration: line-through;
    }
    .quiz-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .progress {
      height: 7px;
      background: #eadfd8;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--avon), var(--gold));
      transition: width .25s ease;
    }
    .question-count {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .question {
      margin: 0 0 14px;
      font-size: 21px;
      line-height: 1.28;
      color: var(--plum);
      letter-spacing: 0;
    }
    .options {
      display: grid;
      gap: 10px;
    }
    .option {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf7;
      color: var(--ink);
      padding: 13px 12px;
      text-align: left;
      cursor: pointer;
    }
    .option strong {
      display: block;
      color: var(--plum);
      font-size: 15px;
      margin-bottom: 3px;
    }
    .option span {
      display: block;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }
    .option.selected {
      border-color: var(--avon);
      box-shadow: 0 0 0 2px rgba(200,24,90,.12);
      background: #fff3f7;
    }
    .quiz-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .primary, .secondary {
      border-radius: 8px;
      padding: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .primary {
      border: 0;
      background: var(--avon);
      color: white;
    }
    .primary:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .secondary {
      border: 1px solid var(--line);
      background: white;
      color: var(--plum);
    }
    .result-summary {
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #ead7ad;
      background: #fff8e8;
      margin-bottom: 12px;
    }
    .result-summary h3 {
      margin: 0 0 6px;
      color: var(--plum);
      font-size: 19px;
    }
    .bottom-cta {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(492px, calc(100vw - 28px));
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      pointer-events: none;
    }
    .bottom-cta button {
      pointer-events: auto;
      border: 0;
      border-radius: 8px;
      padding: 12px 10px;
      color: white;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(93,23,61,.22);
      cursor: pointer;
    }

    .bottom-cta .result-jump { background: var(--green); }
    @media (min-width: 470px) {

      .product { grid-template-columns: 132px 1fr; }
      .product-media img { max-height: 164px; }
    }
  </style>
</head>

      {

        intro: "柔和花香調護手霜，補擦時能留下乾淨細緻的親膚香。"

    const categories = {
      fresh: {
        label: "花果清新",
        subtitle: "明亮果香、綠意茶感、清爽花香，適合日常、通勤與年輕活力形象。"
      },
      floral: {
        label: "柔美花香",
        subtitle: "牡丹、玫瑰、橙花與麝香，適合溫柔、優雅、浪漫的第一印象。"
      },
      warm: {
        label: "東方木質",
        subtitle: "香草、琥珀、檀香與辛香調，適合夜晚、約會、成熟或高記憶點需求。"
      },
      other: {
        label: "其他香氛",
        subtitle: "香體乳、噴霧瓶、身體噴霧香水、香水沐浴精與護手霜，適合疊香、補香與日常保養。"
      }
    };

    const questions = [
      {
        title: "今天這瓶香水主要想用在哪個場景？",
        options: [
          { label: "上班、拜訪客戶", desc: "希望乾淨、有專業感，不打擾別人。", tags: ["office", "classic"] },
          { label: "約會、晚餐、派對", desc: "想留下明確記憶點，靠近時更迷人。", tags: ["date", "bold"] },
          { label: "每天都能輕鬆使用", desc: "不挑衣服，出門前噴一下就好。", tags: ["daily", "fresh"] }
        ]
      },
      {
        title: "你希望別人怎麼形容這個味道？",
        options: [
          { label: "清新自然", desc: "像果香、茶感、綠意或乾淨空氣。", tags: ["fresh", "nature"] },
          { label: "柔美浪漫", desc: "像花束、柔軟肌膚與溫柔靠近。", tags: ["romantic", "soft"] },
          { label: "成熟有個性", desc: "有香草、木質、琥珀或辛香尾韻。", tags: ["warm", "elegant"] }
        ]
      },
      {
        title: "最吸引你的香調線索是？",
        options: [
          { label: "蜜桃、柑橘、莓果", desc: "明亮、有活力、比較容易入門。", tags: ["fresh", "young"] },
          { label: "玫瑰、牡丹、茉莉", desc: "女人味、儀式感與細緻花香。", tags: ["romantic", "elegant"] },
          { label: "香草、檀香、琥珀", desc: "溫暖、包覆感、尾韻更持久。", tags: ["warm", "classic"] }
        ]
      },
      {
        title: "你偏好的擴香感是？",
        options: [
          { label: "靠近才聞得到", desc: "低調、親膚、不希望太搶戲。", tags: ["soft", "office"] },
          { label: "剛剛好被注意", desc: "日常可用，也有自己的存在感。", tags: ["daily", "elegant"] },
          { label: "希望留下印象", desc: "場合感強，適合重點時刻。", tags: ["bold", "date"] }
        ]
      },
      {
        title: "如果用穿搭來形容，你最像哪一種？",
        options: [
          { label: "白襯衫與乾淨妝感", desc: "俐落、清爽、可信賴。", tags: ["office", "fresh"] },
          { label: "洋裝與柔和光澤", desc: "細緻、浪漫、優雅。", tags: ["romantic", "elegant"] },
          { label: "深色套裝或晚宴感", desc: "沉穩、成熟、有氣場。", tags: ["warm", "bold"] }
        ]
      }
    ];

    const state = { step: 0, answers: [], selected: null, resultIds: [] };

    function productCard(product, rank) {
      const rankHtml = rank ? `<span class="pill green">推薦 ${rank}</span>` : "";
      const labels = product.kind === "other"
        ? ["規格", "搭配", "使用情境"]
        : ["前調", "中調", "基調"];
      return `
        <article class="card product">
          <div class="product-media"><img src="${product.image}" alt="${product.name}"></div>
          <div class="product-body">
            <div class="tagline">
              ${rankHtml}
              <span class="pill">${product.family}</span>
              <span class="pill blue">${product.price}</span>
            </div>
            <h3>${product.name}</h3>
            <p class="small">${product.intro}</p>
            <div class="notes">
              <div>${labels[0]}：${product.notes.top}</div>
              <div>${labels[1]}：${product.notes.middle}</div>
              <div>${labels[2]}：${product.notes.base}</div>
            </div>
            <div class="price">${product.price}<span>${product.original}</span></div>
          </div>
        </article>`;
    }

    function renderCategory(key) {
      const data = categories[key];
      const list = products.filter(item => item.category === key);
      document.getElementById(key).innerHTML = `
        <div class="page-head">
          <div class="eyebrow">Fragrance Wardrobe</div>
          <h2>${data.label}</h2>
          <p>${data.subtitle}</p>
        </div>
        <div class="product-grid">${list.map(item => productCard(item)).join("")}</div>`;
    }

    function renderQuiz() {
      const root = document.getElementById("quiz");
      if (state.resultIds.length) {
        const recs = state.resultIds.map(id => products.find(p => p.id === id)).filter(Boolean);
        root.innerHTML = `
          <div class="page-head">
            <div class="eyebrow">Your Scent Match</div>
            <h2>你的專屬推薦</h2>
            <p>依照剛剛的 5 題回答，系統挑出最符合情境、香調與擴香偏好的 2-3 款香水。</p>
          </div>
          <div class="result-summary">
            <h3>${resultPersona()}</h3>
            <p class="small">${resultCopy()}</p>
          </div>
          <div class="product-grid">${recs.map((item, index) => productCard(item, index + 1)).join("")}</div>
          <div class="quiz-actions">
            <button class="secondary" onclick="restartQuiz()">重新測驗</button>
            <button class="primary" onclick="showTab('fresh')">瀏覽全部</button>
          </div>`;
        return;
      }

      const q = questions[state.step];
      const percent = Math.round((state.step / questions.length) * 100);
      root.innerHTML = `
        <div class="page-head">
          <div class="eyebrow">Fragrance Finder</div>
          <h2>香氛顧問測驗</h2>
          <p>用 5 個情境問題，快速找到最適合今天的 AVON 香水。</p>
        </div>
        <div class="quiz-card">
          <div class="progress"><span style="width:${percent}%"></span></div>
          <div class="question-count">QUESTION ${state.step + 1} / ${questions.length}</div>
          <h2 class="question">${q.title}</h2>
          <div class="options">
            ${q.options.map((option, index) => `
              <button class="option ${state.selected === index ? "selected" : ""}" onclick="selectOption(${index})">
                <strong>${option.label}</strong>
                <span>${option.desc}</span>
              </button>`).join("")}
          </div>
          <div class="quiz-actions">
            <button class="secondary" onclick="prevQuestion()" ${state.step === 0 ? "disabled" : ""}>上一題</button>
            <button class="primary" onclick="nextQuestion()" ${state.selected === null ? "disabled" : ""}>${state.step === questions.length - 1 ? "看推薦" : "下一題"}</button>
          </div>
        </div>`;
    }

    function selectOption(index) {
      state.selected = index;
      renderQuiz();
    }

    function prevQuestion() {
      if (state.step === 0) return;
      state.step -= 1;
      state.selected = state.answers[state.step] ?? null;
      renderQuiz();
    }

    function nextQuestion() {
      if (state.selected === null) return;
      state.answers[state.step] = state.selected;
      if (state.step < questions.length - 1) {
        state.step += 1;
        state.selected = state.answers[state.step] ?? null;
        renderQuiz();
        return;
      }
      state.resultIds = calculateResults();
      renderQuiz();
    }

    function calculateResults() {
      const fragranceProducts = products.filter(product => product.kind !== "other");
      const scores = Object.fromEntries(fragranceProducts.map(p => [p.id, 0]));
      state.answers.forEach((answer, questionIndex) => {
        const tags = questions[questionIndex].options[answer].tags;
        fragranceProducts.forEach(product => {
          tags.forEach(tag => {
            if (product.mood.includes(tag)) scores[product.id] += 3;
            if (tag === "fresh" && product.category === "fresh") scores[product.id] += 1;
            if (tag === "romantic" && product.category === "floral") scores[product.id] += 1;
            if (tag === "warm" && product.category === "warm") scores[product.id] += 1;
          });
        });
      });
      return fragranceProducts
        .slice()
        .sort((a, b) => scores[b.id] - scores[a.id])
        .slice(0, 3)
        .map(item => item.id);
    }

    function resultPersona() {
      const tags = state.answers.flatMap((answer, index) => questions[index].options[answer].tags);
      const count = tag => tags.filter(item => item === tag).length;
      if (count("warm") + count("bold") >= 3) return "高記憶點的東方木質型";
      if (count("romantic") + count("elegant") >= 3) return "柔美優雅的花香型";
      return "明亮自在的花果清新型";
    }

    function resultCopy() {
      const title = resultPersona();
      if (title.includes("東方")) return "你適合帶有香草、琥珀、檀香或辛香尾韻的香水，能在約會與重點場合留下更深印象。";
      if (title.includes("花香")) return "你適合玫瑰、牡丹、橙花與麝香交織的香氣，氣質柔和但有細節。";
      return "你適合果香、柑橘、茶感與乾淨木質，日常好穿，也能帶出清爽親和力。";
    }

    function restartQuiz() {
      state.step = 0;
      state.answers = [];
      state.selected = null;
      state.resultIds = [];
      renderQuiz();
    }

    function showTab(id) {
      document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
      document.querySelectorAll(".nav button").forEach(button => button.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      const navButton = document.querySelector(`.nav button[data-tab="${id}"]`);
      if (navButton) navButton.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelectorAll(".nav button").forEach(button => {
      button.addEventListener("click", () => showTab(button.dataset.tab));
    });
    document.querySelectorAll("[data-tab-jump]").forEach(button => {
      button.addEventListener("click", () => showTab(button.dataset.tabJump));
    });

    ["fresh", "floral", "warm", "other"].forEach(renderCategory);
    renderQuiz();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
